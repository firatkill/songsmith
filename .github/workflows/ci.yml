name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:boundaries
      - run: pnpm check:exports
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi && git diff --exit-code

  db:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-supabase-start.sh
      - run: pnpm db:reset
      - run: pnpm db:types
      - run: git diff --exit-code
      - run: pnpm test:db
      - if: always()
        run: pnpm db:stop

  integration:
    needs: db
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 30
    env:
      APP_ENV: ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-supabase-start.sh
      - run: pnpm db:reset
      - name: Run backend integration tests with local credentials
        shell: bash
        run: |
          set -a
          source <(pnpm exec supabase status -o env)
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm test:integration
      - if: always()
        run: pnpm db:stop

  e2e-web:
    needs: integration
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci-supabase-start.sh
      - run: pnpm db:reset
      - run: pnpm --filter @songsmith/frontend exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Lighthouse mobile report (informational)
        continue-on-error: true
        shell: bash
        run: |
          set -a
          source <(pnpm exec supabase status -o env)
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export CHROME_PATH="$(find ~/.cache/ms-playwright -name chrome -type f | head -1)"
          pnpm --filter @songsmith/frontend lighthouse
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-mobile
          path: frontend/.lighthouseci
          include-hidden-files: true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-and-traces
          path: |
            frontend/playwright-report
            frontend/test-results
      - if: always()
        run: pnpm db:stop
