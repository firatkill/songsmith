name: Eval

# Manual evaluation runs (INF-15). Mock costs nothing. Live runs need a budget
# and live adapters with keys in the repository secrets (M6, owner approval).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Golden set
        type: choice
        options: [moderation, lyricist]
        required: true
      mode:
        description: mock or live
        type: choice
        options: [mock, live]
        default: mock
      budget_usd:
        description: Spending limit in USD (required for live)
        type: string
        default: ''
      adapter:
        description: Live text adapter id (required for live)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run evaluation
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          MODE: ${{ inputs.mode }}
          BUDGET_USD: ${{ inputs.budget_usd }}
          ADAPTER: ${{ inputs.adapter }}
        run: |
          args=(--mode "$MODE")
          if [ -n "$BUDGET_USD" ]; then args+=(--budget-usd "$BUDGET_USD"); fi
          if [ -n "$ADAPTER" ]; then args+=(--adapter "$ADAPTER"); fi
          pnpm "eval:$SUITE" "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-${{ inputs.suite }}-${{ inputs.mode }}
          path: eval/reports
