project_id = "songsmith"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "app"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true
otp_length = 6

[auth.email.template.confirmation]
subject = "{{ .Token }}"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "{{ .Token }}"
content_path = "./supabase/templates/otp.html"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

# Express and BullMQ own backend execution; PostHog owns product analytics.
[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/app/before_user_created"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
